name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            sudo chown -R ubuntu:ubuntu /var/www/superbeeaeronautics.com
            cd /var/www/superbeeaeronautics.com
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "Successfully synced to commit:"
            git log -n 1 --oneline
            cd backend
            npm install --production
            cd ..
            npm install
            npm run build
            pm2 restart all
